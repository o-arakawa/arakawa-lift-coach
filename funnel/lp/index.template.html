<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読者特典「歩く前の15分」ワークシート｜『歩きながら、話すだけ。』{{AUTHOR}}</title>
<meta name="description" content="『歩きながら、話すだけ。』読者限定。歩く前の15分シート・3行メモ・誘い文句テンプレ・ルート試走チェックをLINEで受け取れます。">
<meta property="og:title" content="読者特典『歩く前の15分』ワークシート｜歩きながら、話すだけ。">
<meta property="og:description" content="本で渡した型を、そのまま書き込める1冊に。LINEで無料で受け取れます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee4;--ink:#141414;--accent:#e2461c;--muted:#5d5852;--line:#d9d2c5;--white:#fffdf9}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.9;font-size:16px}
.wrap{width:min(680px,calc(100vw - 32px));margin:0 auto}
header.hero{padding:48px 0 36px;position:relative;overflow:hidden}
.eyebrow{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:12px;letter-spacing:.14em;font-weight:700;margin-bottom:18px}
h1{font-size:clamp(26px,6vw,38px);line-height:1.4;margin:0 0 14px;font-weight:900;letter-spacing:.01em}
h1 .accent{color:var(--accent)}
.lead{font-size:16px;color:var(--muted);margin:0 0 24px}
.route{position:absolute;right:-40px;top:-10px;width:260px;opacity:.9;pointer-events:none}
.btn{display:block;width:100%;max-width:440px;background:#06c755;color:#fff;text-decoration:none;text-align:center;font-weight:700;font-size:17px;padding:18px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(6,199,85,.28);transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-2px);opacity:.95}
.btn small{display:block;font-size:12px;font-weight:400;opacity:.9;margin-top:4px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
section{padding:36px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(20px,4.5vw,26px);line-height:1.45;margin:0 0 16px;border-left:6px solid var(--accent);padding-left:12px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:15px}
.num{display:inline-block;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;text-align:center;line-height:28px;font-size:13px;font-weight:700;margin-right:8px}
.steps li{margin:8px 0}
.quote{font-family:"Noto Serif JP",serif;font-size:17px;background:var(--white);border-radius:12px;padding:18px 20px;margin:0 0 16px}
details{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:8px 0}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;color:var(--muted);font-size:15px}
.author{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:start}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--ink);color:#f3eee4;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.band{background:var(--ink);color:#f3eee4;padding:44px 0;margin-top:20px}
.band h2{border-color:#f3eee4;color:#f3eee4}
.band .btn{margin:18px 0 0}
footer{padding:28px 0 60px;font-size:12px;color:var(--muted)}
footer a{color:inherit}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(243,238,228,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:none}
.sticky .btn{max-width:none;padding:14px;font-size:15px;box-shadow:none}
@media (max-width:640px){.sticky{display:block}footer{padding-bottom:110px}}
</style>
</head>
<body>
<!--LP_BODY-->
<div class="sticky"><a class="btn" href="{{LINE_URL}}" rel="noopener">LINEで特典を受け取る（無料）</a></div>
</body>
</html>
